<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="../../favicon.png"><title>My Body — Play & Learn</title><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
:root{--ink:#253842;--teal:#147d78;--paper:#faf8f0;--pink:#f582a2;--yellow:#fbd76b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:16px;padding:14px 21px;background:var(--teal);color:white;font-weight:800;transition:.18s}button:hover{transform:translateY(-2px);filter:brightness(1.07)}button:focus-visible{outline:4px solid #f39b35}header{padding:23px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d9ded5}.logo{font-weight:900;font-size:20px}.tag{background:#e2ede1;padding:8px 14px;border-radius:30px;font-size:13px}main{max-width:1180px;margin:auto;padding:38px 32px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}nav button{background:white;color:var(--ink);padding:10px 14px;font-size:13px;border:1px solid #e0e3d8}nav button.active{background:var(--ink);color:white}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:12px;color:var(--teal);font-weight:900}h1{font-size:clamp(40px,6vw,70px);letter-spacing:-3px;line-height:1.02;margin:15px 0}h2{font-size:36px;margin:10px 0 14px;letter-spacing:-1px}p{line-height:1.65}.lead{font-size:19px;max-width:580px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}.panel{background:white;border:1px solid #e4e5da;border-radius:28px;padding:28px}.hero-art{background:#d9ebe0;position:relative;border-radius:42% 42% 28px 28px;padding:20px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.word{background:white;color:var(--ink);border:1px solid #e2e4d9;padding:18px 8px;font-size:18px}.word svg{width:100%;height:100px;display:block}.muted{color:#64756e;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.secondary{background:#e9eee4;color:var(--ink)}.pink{background:var(--pink);color:var(--ink)}.big{font-size:clamp(26px,4vw,42px);font-weight:900;text-align:center;margin:24px 0}.stage{text-align:center;background:#eef3e9;border-radius:24px;padding:22px;min-height:280px}.stage svg{height:330px;max-width:100%}.feedback{min-height:38px;color:var(--teal);font-size:20px;font-weight:900;margin-top:18px}.options{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.options button{min-width:135px}.progress{height:6px;background:#e2e8db;margin-top:22px;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--teal)}.chip{display:inline-block;background:var(--yellow);padding:8px 14px;border-radius:40px;font-weight:800}.task-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.task-list button{background:white;color:var(--ink);border:1px solid #dae1d5;text-align:left}.task-list button.done{background:#d7e8d8}.small{font-size:13px}input{padding:14px;border:2px solid #cbd8c9;border-radius:12px;max-width:100%}.timer{background:none;color:var(--ink);padding:6px}footer{text-align:center;padding:30px;color:#6e7c70;font-size:13px}.bubble{position:absolute;right:10px;top:30px;background:var(--yellow);padding:14px;border-radius:20px;transform:rotate(7deg);font-weight:900}details{margin-top:22px;font-size:14px}summary{cursor:pointer;font-weight:800}.mini{font-size:15px;padding:10px 15px}.hidden{visibility:hidden}@media(max-width:760px){main{padding:22px 16px}.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}h1{letter-spacing:-2px}.panel{padding:20px}header{padding:18px}.tag{font-size:11px}.stage svg{height:280px}}
</style><header><a class="logo" href="../../" style="color:inherit;text-decoration:none">← English with Nastya</a><span class="tag">MY BODY · 40 MIN · <button class="timer" id="clock" onclick="toggleTimer()">▶ 40:00</button></span></header><main><nav id="nav"></nav><div id="app"></div></main><footer>Look. Say. Move. Play. ✳ Маленькие открытия — на каждом шаге.</footer>
<script>
const words=['arms','nose','face','legs','ears','fingers','hands','eyes','eyebrows','shoulders'];const singular=['arm','nose','face','leg','ear','finger','hand','eye','eyebrow','shoulder'];let section=0,q=0,score=0,built=new Set(),memory=[],flipped=[],lock=false,timer=null,seconds=2400;const names=['Start','Word lab','Build a friend','This / These','Move!','Memory','Detective','Say it!','Final mission'];const times=['2','6','6','5','5','4','4','4','4'];const app=document.getElementById('app');
function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.8;speechSynthesis.speak(u)}}
function person(parts=null,focus='',odd=false){const on=n=>!parts||parts.has(n);const vis=n=>on(n)?'':'opacity="0"';const col=n=>focus===n?'#ee6f91':'#efb58c';return `<svg viewBox="0 0 360 430" role="img" aria-label="Body illustration"><ellipse cx="180" cy="409" rx="100" ry="10" fill="#bfd4c3"/><g ${vis('legs')} fill="#547ba7" stroke="#253842" stroke-width="5"><path d="M142 267h35v112h-43z"/><path d="M184 267h35l7 112h-43z"/><path d="M133 373h44v25h-57q-9-20 13-25" fill="#fbd76b"/><path d="M183 373h44q25 7 13 25h-57z" fill="#fbd76b"/></g><g ${vis('arms')} stroke="${col('arms')}" stroke-width="27" stroke-linecap="round"><path d="M137 186L97 231 71 194"/><path d="M223 186L263 231 289 194"/></g><g ${vis('hands')} fill="${col('hands')}" stroke="#253842" stroke-width="2"><ellipse cx="68" cy="181" rx="16" ry="21"/><ellipse cx="292" cy="181" rx="16" ry="21"/></g><g ${vis('fingers')} stroke="${col('fingers')}" stroke-width="6" stroke-linecap="round">${[0,1,2,3,4].map(i=>`<path d="M${55+i*6} 174v-${18-Math.abs(2-i)*3}"/><path d="M${280+i*6} 174v-${18-Math.abs(2-i)*3}"/>`).join('')}</g><path d="M137 178Q180 156 223 178L224 283Q180 297 136 283Z" fill="#147d78" stroke="#253842" stroke-width="4"/><path d="M169 155v23q11 14 22 0v-23" fill="#efb58c"/><g ${vis('ears')} fill="${col('ears')}" stroke="#253842" stroke-width="3"><ellipse cx="118" cy="108" rx="14" ry="20"/><ellipse cx="242" cy="108" rx="14" ry="20"/></g><g ${vis('face')}><rect x="121" y="42" width="118" height="120" rx="53" fill="${col('face')}" stroke="#253842" stroke-width="4"/><path d="M123 84Q106 31 153 31Q180 7 210 33Q251 25 239 83L222 61Q194 76 166 57Q145 78 123 84" fill="#253842"/><path d="M159 132Q180 152 201 132" fill="white" stroke="#253842" stroke-width="3"/></g><g ${vis('eyes')} fill="#253842"><ellipse cx="153" cy="103" rx="6" ry="8"/><ellipse cx="207" cy="103" rx="6" ry="8"/>${odd?'<ellipse cx="180" cy="88" rx="6" ry="8"/>':''}</g><g ${vis('eyebrows')} stroke="${focus==='eyebrows'?'#ee6f91':'#253842'}" stroke-width="5" stroke-linecap="round"><path d="M143 85l18-2M199 83l18 2"/></g><path ${vis('nose')} d="M179 104l-7 18h16" fill="${col('nose')}" stroke="#c47f62" stroke-width="3"/><g ${vis('shoulders')} fill="${focus==='shoulders'?'#ee6f91':'#fbd76b'}"><circle cx="139" cy="181" r="11"/><circle cx="221" cy="181" r="11"/></g><\/svg>`}
function sentence(w){return ['nose','face'].includes(w)?`This is my ${w}.`:`These are my ${w}.`}
function feedback(t){document.getElementById('fb').textContent=t}function next(){q++;render()}function go(i){section=i;q=0;score=0;render()}function shell(title,sub,body){app.innerHTML=`<div class="eyebrow">MISSION ${String(section).padStart(2,'0')} · ${times[section]} MINUTES</div><h2>${title}</h2><p class="muted">${sub}</p>${body}`}
function render(){document.getElementById('nav').innerHTML=names.map((n,i)=>`<button class="${i===section?'active':''}" onclick="go(${i})">${i+1}. ${n}</button>`).join('');
if(section===0){app.innerHTML=`<div class="grid"><div><div class="eyebrow">A LITTLE BODY ADVENTURE</div><h1>This is<br>my super body!</h1><p class="lead">Сегодня ты — создатель нового друга, детектив и чемпион по забавным командам.</p><div class="actions"><button onclick="go(1)">Let’s play! ↗</button><button class="secondary" onclick="say('Hello! Show me your hands!')">🔊 Hello!</button></div><p class="muted">Разогрев: помаши, улыбнись и покажи руки.<br>“Hello! These are my hands!”</p></div><div class="hero-art">${person()}<span class="bubble">Hello, friend! ✨</span></div></div><details><summary>Для преподавателя · маршрут урока</summary><p>2 мин — приветствие; 6 — слова; 6 — сборка; 5 — грамматика; 5 — движения; 4 — память; 4 — детектив; 4 — речь; 4 — финал. При демонстрации экрана ученик говорит и показывает, преподаватель нажимает. Кнопки 🔊 используют голос браузера; если звук недоступен, читайте сами. Таймер запускается отдельно, переходы свободные. Ученик сначала отвечает устно, затем открывает ответ. Часть тела собирается нажатием после фразы ученика.</p></details>`;return}
if(section===1){let w=words[q%10];shell('Look, listen & point','Нажми на слово, послушай и найди эту часть тела у себя.',`<div class="grid"><div class="stage">${person(null,w)}</div><div><span class="chip">${q%10+1} / 10</span><div class="big">${w}</div><div class="options"><button onclick="say('${w}')">🔊 Listen</button><button class="secondary" onclick="say('${sentence(w)}')">🔊 Sentence</button></div><p>1. Say it. 2. Point to it. 3. Say a sentence.</p><button onclick="next()">Next word →</button></div></div><div class="cards" style="margin-top:22px">${words.map((x,i)=>`<button class="word" onclick="q=${i};render();say('${x}')">${x}</button>`).join('')}</div>`)}
if(section===2){shell('Build a friend','Назови часть тела и произнеси фразу. Затем нажми на деталь — она появится у человечка.',`<div class="grid"><div class="stage">${person(built)}</div><div><span class="chip">${built.size} / 10 pieces</span><h2>${built.size===10?'Hello, new friend!':'Piece by piece ✨'}</h2><p>“This is my face.”<br>“These are my arms.”</p><div class="task-list">${words.map(w=>`<button class="${built.has(w)?'done':''}" onclick="built.add('${w}');say('${sentence(w)}');render()">${built.has(w)?'✓':'＋'} ${w}</button>`).join('')}</div><div class="actions"><button class="secondary mini" onclick="built.clear();render()">Start again</button><button class="mini" onclick="go(3)">Next mission →</button></div></div></div>`)}
if(section===3){let items=['nose','arms','face','eyes','ear','hands','leg','eyebrows','finger','shoulders'];let w=items[q%10],one=singular.includes(w);shell('One or more?','Одна часть: This is my… Несколько: These are my… Сначала скажи предложение целиком.',`<div class="grid"><div class="panel"><span class="chip">ONE</span><h2>This is my nose.</h2><p>Один нос → <b>This is</b></p><span class="chip">MORE THAN ONE</span><h2>These are my arms.</h2><p>Две руки → <b>These are</b></p></div><div class="stage"><span class="muted">${q%10+1} / 10</span><div class="big">___ my ${w}.</div><div class="options"><button onclick="answerGrammar(true,${one})">This is</button><button class="pink" onclick="answerGrammar(false,${one})">These are</button></div><div class="feedback" id="fb"></div><button class="secondary" onclick="next()">Next →</button></div></div>`)}
if(section===4){let cmds=['Touch your nose.','Show me your hands.','Point to your ears.','Touch your shoulders.','Wiggle your fingers.','Point to your eyes.','Touch your face.','Move your arms.','Point to your legs.','Touch your eyebrows.','Simon says: touch your nose.','Touch your ears.','Simon says: show me your hands.','Move your arms.','Simon says: touch your shoulders.'];let c=cmds[q%15];shell('Move, freeze, giggle!','Сначала выполняй команды. С карточки 11: двигайся, только если услышишь “Simon says”.',`<div class="stage"><span class="chip">${q%15+1} / 15 · ${q%15<10?'MOVE!':'SIMON SAYS'}</span><div style="font-size:65px;margin-top:15px">${q%15<10?'🕺':'🧊'}</div><div class="big" id="cmd">Listen…</div><div class="options"><button onclick="say('${c}')">🔊 Command</button><button class="secondary" onclick="document.getElementById('cmd').textContent='${c}'">Show command</button><button onclick="next()">Next →</button></div></div><details><summary>Бонус: ученик становится ведущим</summary><p>Ученик даёт 3 команды учителю. Учитель иногда ошибается — ученик исправляет и показывает верное движение. В Simon says команды 12 и 14 выполнять не нужно.</p></details>`)}
if(section===5){if(!memory.length)resetMemory();shell('Memory match','Найди пары: одна часть тела ↔ несколько. Читай обе карточки: one hand — two hands.',`<div class="task-list" id="memory">${memory.map((x,i)=>`<button style="text-align:center;min-height:70px" id="m${i}" onclick="flip(${i})">★</button>`).join('')}</div><div class="feedback" id="fb"></div><button class="secondary" onclick="resetMemory();render()">New game ↻</button>`)}
if(section===6){let tasks=[['nose','These are my nose.'],['hands','This is my hands.'],['face','These are my face.'],['eyebrows','This is my eyebrows.'],['legs','This is my legs.'],['ears','This is my ears.']];let [w,bad]=tasks[q%6];shell('The silly sentence detective','Робот путает фразы. Найди ошибку и скажи правильно, затем проверь.',`<div class="grid"><div class="stage">${person(null,w)}</div><div class="panel"><span class="chip">CASE ${q%6+1} / 6</span><p class="big">“${bad}”</p><button onclick="feedback('${sentence(w)}');say('${sentence(w)}')">Reveal the correct sentence</button><div class="feedback" id="fb"></div><button class="secondary" onclick="next()">Next case →</button></div></div>`)}
if(section===7){const prompts=['Ты у зеркала. Покажи нос и скажи о нём.','Покажи обе руки целиком (arms). Скажи предложение.','Покажи свои пальцы. Скажи предложение.','Покажи лицо. Скажи предложение.','Покажи брови. Скажи предложение.','Покажи плечи. Скажи предложение.','Покажи глаза. Скажи предложение.','Покажи ноги. Скажи предложение.'];const ws=['nose','arms','fingers','face','eyebrows','shoulders','eyes','legs'];shell('Your turn to speak','Без подсказки на английском: покажи и скажи. Учитель открывает пример после ответа.',`<div class="stage"><span class="chip">${q%8+1} / 8</span><div class="big">${prompts[q%8]}</div><div class="options"><button onclick="feedback('${sentence(ws[q%8])}')">Check</button><button class="secondary" onclick="next()">Next →</button></div><div class="feedback" id="fb"></div></div><details><summary>Draw & describe · дополнительное задание</summary><p>Нарисуй на бумаге забавного героя за 1 минуту. Представь, что ты этот герой. Покажи на рисунке лицо, нос, руки и ноги и скажи 4 предложения. Учитель может нарисовать своего героя и поменяться ролями.</p></details>`)}
if(section===8){const checks=['Назови 5 частей тела без подсказки.','Покажи нос: скажи полное предложение.','Покажи пальцы: скажи полное предложение.','Дай учителю две команды с Touch / Point to / Show me.','Скажи два предложения о собранном друге.'];shell('Final mission: body expert!','Пять заданий без подсказок. Нажимайте на выполненные миссии вместе.',`<div class="grid"><div class="panel"><span class="chip">YOU CAN DO IT!</span><h2>My body passport ✳</h2><div class="task-list" style="grid-template-columns:1fr">${checks.map((c,i)=>`<button onclick="this.classList.toggle('done');this.setAttribute('aria-pressed',this.classList.contains('done'))">☆ ${c}</button>`).join('')}</div><div class="actions"><button onclick="document.getElementById('celebrate').textContent='Amazing work! You are a body expert! ⭐';say('Amazing work!')">Finish the adventure ✨</button></div><div class="feedback" id="celebrate"></div></div><div class="hero-art">${person()}<p style="text-align:center"><b>Домашняя мини-миссия:</b> нарисуй себя и подпиши 5 частей тела. Скажи дома 3 предложения.</p></div></div>`)}}
function answerGrammar(chosen,correct){if(chosen===correct){feedback('Yes! Say the whole sentence. ⭐');say('Well done!')}else feedback('Try again: one or more than one?')}
function resetMemory(){memory=['arm','hand','ear','eye','leg','finger'].flatMap((x,i)=>[{id:i,text:'one '+x},{id:i,text:'two '+x+'s'}]).sort(()=>Math.random()-.5);flipped=[];lock=false}
function flip(i){if(lock||flipped.includes(i)||document.getElementById('m'+i).dataset.done)return;let b=document.getElementById('m'+i);b.textContent=memory[i].text;say(memory[i].text);flipped.push(i);if(flipped.length===2){let [a,c]=flipped;if(memory[a].id===memory[c].id){[a,c].forEach(n=>{let z=document.getElementById('m'+n);z.dataset.done='1';z.classList.add('done')});flipped=[];feedback('A pair! Say: These are my '+memory[a].text.split(' ')[1].replace(/s$/,'')+'s.');}else{lock=true;setTimeout(()=>{if(section===5)[a,c].forEach(n=>{let z=document.getElementById('m'+n);if(z)z.textContent='★'});flipped=[];lock=false},1400)}}}
function toggleTimer(){if(timer){clearInterval(timer);timer=null}else timer=setInterval(()=>{if(seconds>0)seconds--;else{clearInterval(timer);timer=null}drawClock()},1000);drawClock()}function drawClock(){document.getElementById('clock').textContent=(timer?'Ⅱ ':'▶ ')+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}render();
</script></html>
