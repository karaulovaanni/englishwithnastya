<style>

</style></head><body><main><a class="home-link" href="../../#lessons">← К урокам</a><header><div><div class="eyebrow">ENGLISH WITH NASTYA · A1</div><h1>This, these, that, those</h1><p>Grammar practice · A1</p></div><button id="reset">Начать заново</button></header><nav aria-label="Этапы урока"><button id="ruleTab" aria-pressed="true">1 · Повторяем</button><button id="practiceTab" aria-pressed="false">2 · Тренируемся</button></nav><section class="panel" id="content"></section><footer>Посмотри → выбери → произнеси предложение</footer></main>
<script>
const tasks=[
{n:'book',p:'books',e:'📘',many:false,far:false},
{n:'cat',p:'cats',e:'🐈',many:false,far:true},
{n:'pencil',p:'pencils',e:'✏️',many:true,far:false},
{n:'ball',p:'balls',e:'⚽',many:true,far:true},
{n:'bag',p:'bags',e:'🎒',many:false,far:true},
{n:'apple',p:'apples',e:'🍎',many:true,far:false},
{n:'dog',p:'dogs',e:'🐕',many:false,far:false},
{n:'flower',p:'flowers',e:'🌷',many:true,far:true},
{n:'kite',p:'kites',e:'🪁',many:false,far:true},
{n:'car',p:'cars',e:'🚗',many:true,far:false},
{n:'doll',p:'dolls',e:'🪆',many:false,far:false},
{n:'tree',p:'trees',e:'🌳',many:true,far:true}];
tasks.sort((a,b)=>Number(a.many)-Number(b.many));
const content=document.getElementById('content'),ruleTab=document.getElementById('ruleTab'),practiceTab=document.getElementById('practiceTab');
let rule=0,index=0,answers={},stage='rule';
function word(t){return t.far?(t.many?'Those':'That'):(t.many?'These':'This')}
function sentence(t){return word(t)+' '+(t.many?'are '+t.p:'is '+(/^[aeiou]/i.test(t.n)?'an ':'a ')+t.n)+'.'}
function tabs(){ruleTab.setAttribute('aria-pressed',stage==='rule');practiceTab.setAttribute('aria-pressed',stage==='practice')}
function rules(){stage='rule';tabs();content.innerHTML=rule===0?
'<h2>Один предмет</h2><p>Представь, что ты стоишь рядом с человечком 👧. Близко к нему — <b>this</b>, далеко от него — <b>that</b>.</p><div class="grid"><div class="rule"><b>This</b><div class="mini">👧 📘</div><p>Один предмет рядом</p><p class="sample">This is a book.</p><span class="small">Это книга.</span></div><div class="rule"><b>That</b><div class="mini">👧 · · · 📘</div><p>Один предмет далеко</p><p class="sample">That is a book.</p><span class="small">То — книга.</span></div></div><details><summary>Устно перед продолжением</summary>Покажи ручку рядом и скажи: This is a pen. Затем укажи на предмет в другом конце комнаты: That is a …</details><div class="row bottom"><span class="small">Правило · 1 из 2</span><button class="primary" id="more">Тренируем this / that →</button></div>':
'<h2>Несколько предметов</h2><p>Рядом — <b>these</b>. Далеко — <b>those</b>. С ними используем <b>are</b> и множественное число.</p><div class="grid"><div class="rule"><b>These</b><div class="mini">👧 📘📘</div><p>Несколько предметов рядом</p><p class="sample">These are books.</p><span class="small">Это книги.</span></div><div class="rule"><b>Those</b><div class="mini">👧 · · · 📘📘</div><p>Несколько предметов далеко</p><p class="sample">Those are books.</p><span class="small">То — книги.</span></div></div><details><summary>Запоминаем пары</summary>This → These · рядом<br>That → Those · далеко<br>This/That + is · These/Those + are</details><div class="row bottom"><button id="previous">← Назад</button><button class="primary" id="more">Тренируем these / those →</button></div>';
document.getElementById('more').onclick=()=>{index=rule===0?0:6;practice()};
const prev=document.getElementById('previous');if(prev)prev.onclick=()=>{rule=0;rules()}}
function practice(){stage='practice';tabs();if(index>=tasks.length){finish();return}const t=tasks[index];
content.innerHTML='<div class="small">Карточка '+(index+1)+' из '+tasks.length+'</div><progress max="'+tasks.length+'" value="'+index+'"></progress><h2>Выбери слово и прочитай вслух</h2><div class="scene" role="img" aria-label="'+(t.many?'Несколько предметов':'Один предмет')+', '+(t.far?'далеко от девочки':'рядом с девочкой')+'"><span class="person" aria-hidden="true">👧</span><div class="target '+(t.far?'far':'near')+'"><span aria-hidden="true">'+t.e+(t.many?t.e:'')+'</span><span class="distance">'+(t.far?'ДАЛЕКО':'РЯДОМ')+'</span></div></div><p class="question">___ '+(t.many?'are '+t.p:'is a '+t.n)+'.</p><div class="row answers">'+['This','These','That','Those'].map(w=>'<button data-answer="'+w+'">'+w+'</button>').join('')+'</div><div class="status" aria-live="polite" id="feedback"></div><details><summary>Нужна подсказка?</summary>Сколько предметов? Где они относительно девочки?<br>Один рядом → this · один далеко → that<br>Несколько рядом → these · несколько далеко → those</details><div class="row bottom"><button id="back" '+(index===0?'disabled':'')+'>← Назад</button><button id="next" class="primary" '+(!answers[index]?'disabled':'')+'>'+(index===tasks.length-1?'Завершить':'Дальше →')+'</button></div>';
if(answers[index])document.getElementById('feedback').textContent='✓ '+sentence(t);
content.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const correct=b.dataset.answer===word(t);document.getElementById('feedback').textContent=correct?'✓ Верно! '+sentence(t):'Попробуй ещё. '+(t.many?'Предметов несколько. ':'Предмет один. ')+(t.far?(t.many?'Они далеко от девочки.':'Он далеко от девочки.'):(t.many?'Они рядом с девочкой.':'Он рядом с девочкой.'));if(correct){answers[index]=true;document.getElementById('next').disabled=false} });
document.getElementById('back').onclick=()=>{index--;practice()};document.getElementById('next').onclick=()=>{index++;if(index===6){rule=1;rules()}else practice()}}
function finish(){content.innerHTML='<h2>Отлично! Теперь о своём ✨</h2><p>Ты прошла все 12 карточек. Составь четыре предложения с предметами вокруг себя.</p><div class="grid"><div class="rule"><b>This is a …</b><p>Покажи один предмет рядом.</p></div><div class="rule"><b>These are …</b><p>Покажи несколько предметов рядом.</p></div><div class="rule"><b>That is a …</b><p>Укажи на один предмет далеко.</p></div><div class="rule"><b>Those are …</b><p>Укажи на несколько предметов далеко.</p></div></div><div class="row bottom"><button id="last">← К карточкам</button><button class="primary" id="again">Повторить практику</button></div>';document.getElementById('last').onclick=()=>{index=tasks.length-1;practice()};document.getElementById('again').onclick=()=>{index=0;answers={};practice()}}
ruleTab.onclick=rules;practiceTab.onclick=practice;document.getElementById('reset').onclick=()=>{index=0;rule=0;answers={};rules()};rules();
</script></body></html>
